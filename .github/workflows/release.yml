name: release

# Push a tag v<version> (the root package.json's version) to build the installers on every OS and
# attach them to a DRAFT release. Review it, then publish it from GitHub. Builds are unsigned: no
# secrets are used besides the workflow's own GITHUB_TOKEN.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2; exit 1; }
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Workhub 2 ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}"

  installers:
    name: installers (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # No Apple Development identity on the runner: the macOS app is signed ad hoc, not notarized.
      - run: npm run dist
      - name: Checksums and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          files=()
          for f in *-"${GITHUB_REF_NAME#v}"-*.dmg *-"${GITHUB_REF_NAME#v}"-*.zip *-"${GITHUB_REF_NAME#v}"-*.exe *-"${GITHUB_REF_NAME#v}"-*.AppImage *-"${GITHUB_REF_NAME#v}"-*.deb latest*.yml *.blockmap; do
            [ -e "$f" ] || continue
            files+=("$f")
            case "$f" in *.yml|*.blockmap) ;; *) 
              if command -v shasum >/dev/null; then shasum -a 256 "$f" > "$f.sha256"; else sha256sum "$f" > "$f.sha256"; fi
              files+=("$f.sha256") ;;
            esac
          done
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
