name: release

# Push a tag v<version> (the root package.json's version) to build the installers on every OS and
# attach them to a DRAFT release. Review it, then publish it from GitHub. Builds are unsigned: no
# secrets are used besides the workflow's own GITHUB_TOKEN.
#
# The jobs that run npm code (npm ci, tests, electron-builder) only read the repository and hand
# their files over as artifacts. Only the last job can write to the repository, and it runs no
# npm code: it downloads those artifacts and attaches them to the release with the gh CLI.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2; exit 1; }

  installers:
    name: installers (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # No Apple Development identity on the runner: the macOS app is signed ad hoc, not notarized.
      - run: npm run dist
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          mkdir -p ../release-files
          for f in *-"${GITHUB_REF_NAME#v}"-*.dmg *-"${GITHUB_REF_NAME#v}"-*.zip *-"${GITHUB_REF_NAME#v}"-*.exe *-"${GITHUB_REF_NAME#v}"-*.AppImage *-"${GITHUB_REF_NAME#v}"-*.deb latest*.yml *.blockmap; do
            [ -e "$f" ] || continue
            cp "$f" ../release-files/
            case "$f" in *.yml|*.blockmap) ;; *)
              if command -v shasum >/dev/null; then shasum -a 256 "$f" > "../release-files/$f.sha256"; else sha256sum "$f" > "../release-files/$f.sha256"; fi ;;
            esac
          done
          ls -l ../release-files
      # electron-updater reads latest*.yml (latest-mac.yml, latest.yml, latest-linux.yml): every OS
      # writes its own name, so the three artifacts never overwrite each other.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Create the draft release and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-files
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Workhub 2 ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}"
          shopt -s nullglob
          files=(*)
          [ "${#files[@]}" -gt 0 ] || { echo "no release files were built" >&2; exit 1; }
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
