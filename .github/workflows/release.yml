name: release

# Builds the installers for tag v<version> (the root package.json's version) on every OS, attaches
# them to the release and publishes it as the latest one. Builds are unsigned: no secrets are used
# besides the workflow's own GITHUB_TOKEN.
#
# Two ways in:
# - release-please (.github/workflows/release-please.yml) calls this workflow with the tag when it
#   creates a release. It has to call it: a tag or release made with the default GITHUB_TOKEN never
#   starts another workflow, so the push trigger below would not fire for it.
# - Pushing a v* tag by hand (the manual fallback). The release is created here, as a draft until
#   its files are uploaded.
#
# The jobs that run npm code (npm ci, tests, electron-builder) only read the repository and hand
# their files over as artifacts. Only the last job can write to the repository, and it runs no
# npm code: it downloads those artifacts and attaches them to the release with the gh CLI. The
# attest job in between signs a build provenance statement for every installer; it also runs no npm
# code and cannot write to the repository.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'The release tag to build, v<version>'
        required: true
        type: string

permissions:
  contents: read

# The tag being released: the input when called, the pushed tag otherwise. Always read through the
# TAG environment variable in scripts, never interpolated into them.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Check the tag matches the version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "tag $TAG is not v<semver>" >&2; exit 1; }
          version="$(node -p "require('./package.json').version")"
          app_version="$(node -p "require('./packages/app/package.json').version")"
          test "v$version" = "$TAG" || { echo "tag $TAG does not match package.json version $version" >&2; exit 1; }
          test "$app_version" = "$version" || { echo "packages/app version $app_version does not match $version" >&2; exit 1; }

  installers:
    name: installers (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # No Apple Development identity on the runner: the macOS app is signed ad hoc, not notarized.
      - run: npm run dist
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          mkdir -p ../release-files
          for f in *-"${TAG#v}"-*.dmg *-"${TAG#v}"-*.zip *-"${TAG#v}"-*.exe *-"${TAG#v}"-*.AppImage *-"${TAG#v}"-*.deb latest*.yml *.blockmap; do
            [ -e "$f" ] || continue
            cp "$f" ../release-files/
            case "$f" in *.yml|*.blockmap) ;; *)
              if command -v shasum >/dev/null; then shasum -a 256 "$f" > "../release-files/$f.sha256"; else sha256sum "$f" > "../release-files/$f.sha256"; fi ;;
            esac
          done
          # The same installers under names without the version, so README links of the form
          # releases/latest/download/Workhub-2-win-x64.exe always fetch the newest one. latest*.yml
          # keep pointing at the versioned files, which the in-app updater reads.
          for f in *-"${TAG#v}"-*.dmg *-"${TAG#v}"-*.zip *-"${TAG#v}"-*.exe *-"${TAG#v}"-*.AppImage *-"${TAG#v}"-*.deb; do
            [ -e "$f" ] || continue
            stable="${f/-${TAG#v}-/-}"
            cp "$f" "../release-files/$stable"
            (cd ../release-files && if command -v shasum >/dev/null; then shasum -a 256 "$stable" > "$stable.sha256"; else sha256sum "$stable" > "$stable.sha256"; fi)
          done
          ls -l ../release-files
      # electron-updater reads latest*.yml (latest-mac.yml, latest.yml, latest-linux.yml): every OS
      # writes its own name, so the three artifacts never overwrite each other.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  # The Linux host payload the app installs into a WSL distribution on first use
  # (scripts/stage-host.mjs): one archive per arch, built on an Ubuntu 22.04 runner of that arch (node-pty's
  # pty.node links the runner's glibc, so an older runner keeps 22.04+ distros working) because
  # node-pty is native and not cross-built. arm64 uses GitHub's arm64 runner; it may not fail the
  # release (continue-on-error), so a missing arm64 payload only leaves arm64 distributions without one.
  host-payload:
    name: host payload (linux-${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @workhub/app
      - name: Stage the payload
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          node scripts/stage-host.mjs --arch "$ARCH" --out host-payload
          mkdir -p release-files
          cp host-payload/workhub-host-"${TAG#v}"-linux-"$ARCH".tar.gz host-payload/workhub-host-"${TAG#v}"-linux-"$ARCH".tar.gz.sha256 release-files/
          ls -l release-files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-host-${{ matrix.arch }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  # Build provenance: a signed statement, kept by GitHub, that these exact files were built by this
  # workflow from this tag. `gh attestation verify <file> --repo <owner>/<repo>` checks it. It
  # attests the files the installers job uploaded, not a rebuild, so the digests are the ones the
  # .sha256 files and the release carry.
  attest:
    needs: [installers, host-payload]
    runs-on: ubuntu-latest
    permissions:
      # Read the repository for the action's own needs; no write access to it.
      contents: read
      # Lets the job ask GitHub for the OIDC token that Sigstore signs the statement against.
      id-token: write
      # Lets the job store the attestation on the repository.
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      # The installers and host payloads only: checksums, update manifests and block maps are not attested.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-files/*.dmg
            release-files/*.zip
            release-files/*.exe
            release-files/*.AppImage
            release-files/*.deb
            release-files/workhub-host-*.tar.gz

  publish:
    needs: [installers, host-payload, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      # release-please has already created the release, as a pre-release with its changelog as the
      # notes; a manual tag has none yet, so it is created here as a draft. Once the files are up,
      # every release, alpha ones included, is published as a release that is not a pre-release and
      # is the latest: its releases/latest/download/<file> links (the README's download links and
      # the one-line installers) only follow the "latest" release, and GitHub never makes a
      # pre-release the latest. Until then the app's update check skips it, as it has no update
      # manifest yet (packages/app/src/main/release-pick.ts). The version keeps its suffix
      # (2.0.0-alpha.N), so a future stable install never takes an alpha as an update: semver puts
      # 2.0.0-alpha.N below 2.0.0 (see packages/app/src/main/updates.ts).
      - name: Create or find the release, upload the files and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-files
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Workhub 2 ${TAG#v}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Workhub 2 ${TAG#v}" --generate-notes --prerelease=false
          fi
          shopt -s nullglob
          files=(*)
          [ "${#files[@]}" -gt 0 ] || { echo "no release files were built" >&2; exit 1; }
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
