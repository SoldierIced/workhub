name: release

# Builds the installers for tag v<version> (the root package.json's version) on every OS and
# attaches them to a DRAFT release. Review it, then publish it from GitHub. Builds are unsigned: no
# secrets are used besides the workflow's own GITHUB_TOKEN.
#
# Two ways in:
# - release-please (.github/workflows/release-please.yml) calls this workflow with the tag when it
#   creates a release. It has to call it: a tag or release made with the default GITHUB_TOKEN never
#   starts another workflow, so the push trigger below would not fire for it.
# - Pushing a v* tag by hand (the manual fallback). The draft release is created here.
#
# The jobs that run npm code (npm ci, tests, electron-builder) only read the repository and hand
# their files over as artifacts. Only the last job can write to the repository, and it runs no
# npm code: it downloads those artifacts and attaches them to the release with the gh CLI.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'The release tag to build, v<version>'
        required: true
        type: string

permissions:
  contents: read

# The tag being released: the input when called, the pushed tag otherwise. Always read through the
# TAG environment variable in scripts, never interpolated into them.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Check the tag matches the version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "tag $TAG is not v<semver>" >&2; exit 1; }
          version="$(node -p "require('./package.json').version")"
          app_version="$(node -p "require('./packages/app/package.json').version")"
          test "v$version" = "$TAG" || { echo "tag $TAG does not match package.json version $version" >&2; exit 1; }
          test "$app_version" = "$version" || { echo "packages/app version $app_version does not match $version" >&2; exit 1; }

  installers:
    name: installers (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # No Apple Development identity on the runner: the macOS app is signed ad hoc, not notarized.
      - run: npm run dist
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          mkdir -p ../release-files
          for f in *-"${TAG#v}"-*.dmg *-"${TAG#v}"-*.zip *-"${TAG#v}"-*.exe *-"${TAG#v}"-*.AppImage *-"${TAG#v}"-*.deb latest*.yml *.blockmap; do
            [ -e "$f" ] || continue
            cp "$f" ../release-files/
            case "$f" in *.yml|*.blockmap) ;; *)
              if command -v shasum >/dev/null; then shasum -a 256 "$f" > "../release-files/$f.sha256"; else sha256sum "$f" > "../release-files/$f.sha256"; fi ;;
            esac
          done
          ls -l ../release-files
      # electron-updater reads latest*.yml (latest-mac.yml, latest.yml, latest-linux.yml): every OS
      # writes its own name, so the three artifacts never overwrite each other.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: release-files/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      # release-please has already created the draft release (with its changelog as the notes); a
      # manual tag has none yet, so it is created here. Either way a version with a suffix
      # (2.0.0-alpha.2) is marked as a pre-release: electron-updater offers pre-releases only to
      # installs that run a pre-release themselves (allowPrerelease, see
      # packages/app/src/main/updates.ts), and GitHub never makes a pre-release the "latest" one.
      - name: Create or find the draft release and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-files
        run: |
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Workhub 2 ${TAG#v}" --prerelease="$prerelease"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Workhub 2 ${TAG#v}" --generate-notes --prerelease="$prerelease"
          fi
          shopt -s nullglob
          files=(*)
          [ "${#files[@]}" -gt 0 ] || { echo "no release files were built" >&2; exit 1; }
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
