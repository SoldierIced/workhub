name: release-please

# On every push to main, release-please (release-please-config.json, .release-please-manifest.json)
# opens or updates the release pull request: the next version in every package.json and
# package-lock.json, and the new CHANGELOG.md entry, built from the Conventional Commits since the
# last release. Merging that pull request makes the run on the merge commit tag it and create a
# DRAFT pre-release with the changelog as its notes; this workflow then calls release.yml to build
# the installers and attach them to that draft. Review it, then publish it from GitHub.
#
# release.yml is called rather than left to its tag trigger because a tag or release created with
# the default GITHUB_TOKEN never starts another workflow. No other secret is used.
#
# The release-please job runs no npm code; it is the only one here that can write pull requests.
# The installers are built by release.yml's read-only jobs, and only its last job, which runs no
# npm code either, can write to the repository (to upload the files to the release).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # One run at a time edits the release pull request; a queued run is never cancelled mid-way.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write # the release branch, the tag and the draft release
      pull-requests: write # the release pull request
      issues: write # the autorelease labels on it
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installers:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # A called workflow's token can never exceed what the caller grants: release.yml keeps every
    # npm-running job at contents: read and gives contents: write to its upload job only.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
