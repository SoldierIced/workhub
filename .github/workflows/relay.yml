name: relay image

on:
  push:
    branches: [main]
    paths:
      - 'packages/relay/**'
      - 'packages/protocol/**'
      - 'packages/app/src/web/**'
      - 'packages/app/vite.web.config.ts'
      - 'packages/app/scripts/build-web.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/relay.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Every workspace, without the install scripts (no Electron download): the phone app is built
      # from packages/app and copied into the image next to the relay.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck -w @workhub/protocol -w @workhub/relay
      - run: npx vitest run --project protocol --project relay
      - run: npm run build:web -w @workhub/app
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry paths must be lowercase; the repository owner is not.
      - run: echo "IMAGE=ghcr.io/${OWNER,,}/workhub-relay" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/relay/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
