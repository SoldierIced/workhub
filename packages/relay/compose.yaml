# Self-hosting the relay behind a reverse proxy that terminates TLS (nginx, Caddy, Traefik).
# Copy .env.example to .env and fill the VAPID keys (node relay.cjs --vapid prints a fresh pair).
services:
  relay:
    image: ghcr.io/soldiericed/workhub-relay:latest
    container_name: workhub-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file: .env
    environment:
      WEB_CLIENT_DIR: /web
      TRUST_PROXY: "1"
    volumes:
      - relay-data:/data
    mem_limit: 256m

volumes:
  relay-data:
